<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Helvetica Neue', Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14">
  <style>
    .box{stroke-width:1.5;rx:8}
    .s1{fill:#e8f1fb;stroke:#2b6cb0}
    .s2{fill:#e6f4ea;stroke:#2f855a}
    .s3{fill:#fdf3e1;stroke:#b7791f}
    .lbl{fill:#1a202c;font-weight:bold}
    .sub{fill:#4a5568;font-size:12px}
    .note{fill:#2d3748;font-size:12px}
    .arrow{stroke:#4a5568;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .dash{stroke:#b7791f;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#b)}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b7791f"/></marker>
  </defs>

  <rect x="20" y="40" width="220" height="120" class="box s1" rx="8"/>
  <text x="130" y="66" text-anchor="middle" class="lbl">① 事前学習</text>
  <text x="130" y="90" text-anchor="middle" class="sub">Web規模のテキスト（数兆トークン）</text>
  <text x="130" y="110" text-anchor="middle" class="sub">「次のトークンは何か」だけを学ぶ</text>
  <text x="130" y="140" text-anchor="middle" class="note">→ ベースモデル：言語は知っているが</text>
  <text x="130" y="154" text-anchor="middle" class="note">　指示には従わない</text>

  <line x1="240" y1="100" x2="268" y2="100" class="arrow"/>

  <rect x="270" y="40" width="220" height="120" class="box s2" rx="8"/>
  <text x="380" y="66" text-anchor="middle" class="lbl">② 教師ありファインチューニング</text>
  <text x="380" y="90" text-anchor="middle" class="sub">人が書いた（指示, 模範回答）のペア</text>
  <text x="380" y="110" text-anchor="middle" class="sub">数万〜数十万件、質が命</text>
  <text x="380" y="140" text-anchor="middle" class="note">→ 指示に従って答える形式を覚える</text>

  <line x1="490" y1="100" x2="518" y2="100" class="arrow"/>

  <rect x="520" y="40" width="220" height="120" class="box s3" rx="8"/>
  <text x="630" y="66" text-anchor="middle" class="lbl">③ 選好チューニング</text>
  <text x="630" y="90" text-anchor="middle" class="sub">2つの回答を人が比較「こちらが良い」</text>
  <text x="630" y="110" text-anchor="middle" class="sub">RLHF / DPO など</text>
  <text x="630" y="140" text-anchor="middle" class="note">→ 好まれる答え方に寄せる</text>

  <path d="M130,160 C130,230 630,230 630,160" class="dash"/>
  <text x="380" y="240" text-anchor="middle" class="note">DeepSeek-R1-Zero（2025）：②を飛ばし、ベースモデルに検証可能な報酬でRLを直接かけて推論能力が現れた</text>

  <rect x="20" y="270" width="720" height="44" fill="#f4f6f8" stroke="#4a5568" stroke-width="1" rx="6"/>
  <text x="380" y="288" text-anchor="middle" class="note">私たちがAPI越しに触るのは③の出口。②③相当の学習を自分のデータで追加するのが事後学習（後編で扱う）</text>
  <text x="380" y="304" text-anchor="middle" class="sub">用語は資料によって揺れる：②③をまとめて「事後学習」「アライメント」と呼ぶこともある</text>
</svg>
